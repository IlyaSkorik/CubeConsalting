{% load static %}

<section class="relative w-full min-h-[calc(100vh-6rem)] flex flex-col items-center justify-between bg-[url('/static/desktop/img/hero-bg-light.png')] dark:bg-[url('/static/desktop/img/hero-bg-dark.png')] bg-contain bg-no-repeat bg-center overflow-hidden pt-4 pb-2">
    <div class="relative z-10 flex flex-col items-center text-center px-4 max-w-3xl mx-auto mt-4">
        <h1 class="font-heading 2xl:text-5xl text-6xl font-bold text-text leading-[1.15] tracking-tight mb-3">
            Прорыв там,<br>где другие видят стены
        </h1>

        <p class="text-text/70 text-base 2xl:text-sm max-w-2xl mb-4 leading-relaxed">
            Автоматизация бизнес-решений. Сокращаем время реакции от часов до минут.
        </p>

        <div class="flex items-center gap-4">
            <button class="bg-primary hover:bg-primary/80 text-white font-semibold px-7 2xl:py-3 py-3.5 rounded-lg flex items-center gap-2 shadow-[0_0_25px_rgba(var(--primary),0.45)] transition cursor-pointer">
                🚀 Запустить прорыв <span>→</span>
            </button>
            <button class="bg-text/10 hover:bg-text/10 border border-text/10 text-text/80 font-medium px-7 2xl:py-3 py-3.5 rounded-lg transition backdrop-blur-[1px] cursor-pointer">
                Попробовать демо
            </button>
        </div>
    </div>
    <div class="relative z-10 w-9/12 max-w-140 flex items-center justify-between border dark:border-black/5 bg-white/5 border-primary/30  dark:bg-primary/5 backdrop-blur-[1px] rounded-2xl px-4 py-2 mt-auto shadow-[0_0_50px_-12px_rgba(var(--accent),0.15)]">
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition">
                ⚡
            </div>
            <div class="flex flex-col">
                <span class="text-sm/tight text-center font-semibold text-text/50 dark:text-white/40 tracking-wider">зкономия</span>
                <span class="text-2xl text-center font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)]">40</span>
                <span class="text-xs text-center text-text/60 dark:text-white/50 lowercase">часов/неделю</span>
            </div>
        </div>
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition">
                📦
            </div>
            <div class="flex flex-col">
                <span class="text-sm/tight text-center font-semibold text-text/50 dark:text-white/40 tracking-wider">скорость решений</span>
                <span class="text-2xl text-center font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)]">х10</span>
                <span class="text-xs text-center text-text/60 dark:text-white/50 lowercase">в среднем</span>
            </div>
        </div>
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition">
                👥
            </div>
            <div class="flex flex-col">
                <span class="text-sm/tight text-center font-semibold text-text/50 dark:text-text/40 tracking-wider">внедрено за</span>
                <span class="text-2xl text-center font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)]">3</span>
                <span class="text-xs text-center text-text/60 dark:text-white/50 lowercase">дня</span>
            </div>
        </div>
    
    </div>
    
</section>
