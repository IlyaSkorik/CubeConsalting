{% load static %}

<section class="relative w-full min-h-[calc(100vh-6rem)] flex flex-col items-center justify-between bg-[url('/static/desktop/img/hero-bg-light.png')] dark:bg-[url('/static/desktop/img/hero-bg-dark.png')] bg-contain bg-no-repeat bg-center overflow-hidden pt-4 pb-8">
    <div class="relative z-10 flex flex-col items-center text-center px-4 max-w-3xl mx-auto mt-4">
        
        <span class="inline-block bg-primary/10 border border-primary/30 text-accent text-xs font-semibold px-4 py-1.5 rounded-full uppercase tracking-widest mb-4">
            Платформа автоматизации бизнес-решений
        </span>

        <h1 class="font-heading text-6xl font-bold text-text leading-[1.15] tracking-tight mb-5">
            Прорыв там,<br>где другие видят стены
        </h1>

        <p class="text-text/70 text-base max-w-2xl mb-8 leading-relaxed">
            Автоматизация бизнес-решений. Сокращаем время реакции от часов до минут.
        </p>

        <div class="flex items-center gap-4">
            <button class="bg-primary hover:bg-primary/80 text-white font-semibold px-7 py-3.5 rounded-full flex items-center gap-2 shadow-[0_0_25px_rgba(var(--primary),0.45)] transition cursor-pointer">
                🚀 Запустить прорыв <span>→</span>
            </button>
            <button class="bg-text/5 hover:bg-text/10 border border-text/10 text-text font-medium px-7 py-3.5 rounded-full transition backdrop-blur-sm cursor-pointer">
                Попробовать демо
            </button>
        </div>
    </div>
    <div class="relative z-10 w-9/12 max-w-200 flex items-center justify-between border border-black/5 dark:border-primary/30 bg-white/80 dark:bg-primary/5 backdrop-blur-md rounded-2xl px-8 py-6 mt-auto shadow-[0_0_50px_-12px_rgba(var(--accent),0.15)]">
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition group-hover:scale-110">
                ⚡
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-text/50 dark:text-white/40 uppercase tracking-wider">Решений обрабатывается</span>
                <span class="text-2xl font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)] my-0.5">24.7M+</span>
                <span class="text-xs text-text/60 dark:text-white/50 lowercase">ежедневно</span>
            </div>
        </div>
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition group-hover:scale-110">
                📦
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-text/50 dark:text-white/40 uppercase tracking-wider">Экономии времени</span>
                <span class="text-2xl font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)] my-0.5">10x</span>
                <span class="text-xs text-text/60 dark:text-white/50 lowercase">в среднем</span>
            </div>
        </div>
    
        <div class="flex items-center gap-4 group">
            <div class="flex items-center justify-center text-accent text-4xl drop-shadow-[0_0_8px_rgba(var(--accent),0.6)] transition group-hover:scale-110">
                👥
            </div>
            <div class="flex flex-col">
                <span class="text-xs font-semibold text-text/50 uppercase tracking-wider">Компаний уже с нами</span>
                <span class="text-2xl font-bold text-accent drop-shadow-[0_0_12px_rgba(var(--accent),0.4)] my-0.5">500+</span>
                <span class="text-xs text-text/60 dark:text-white/50 lowercase">растём вместе</span>
            </div>
        </div>
    
    </div>
    
</section>
