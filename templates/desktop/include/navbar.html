{% load static %}

<header id="site-nav" class="sticky top-0 z-50 w-full flex justify-center pt-4">
  <div
  class="relative w-11/12 max-w-425 h-15 px-8 rounded-lg

  border border-white/8
  bg-white/4 dark:bg-white/2.5

  backdrop-blur-xs
  backdrop-saturate-50

  shadow-[0_0_16px_color-mix(in_oklab,var(--logo)_16%,transparent),0_5px_15px_rgba(0,0,0,0.08),inset_0_1px_0_rgba(255,255,255,0.04)]

  flex items-center"
>
    <!-- GLASS LIGHT -->
    <div
      class="absolute inset-0 bg-[linear-gradient(to_bottom,rgba(255,255,255,0.01),transparent_45%)] pointer-events-none"
    ></div>
    <!-- LEFT -->
    <div class="flex items-center gap-5 z-10">
      <a
        href="#solutions"
        data-section="solutions"
        class="text-[14px] font-medium text-text hover:text-primary transition"
      >
        Решения
      </a>

      <div
        class="w-4 h-4 flex items-center fill-primary justify-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 595.3 841.9"
          class="w-full h-auto text-primary"
        >
          <path
            d="M297.6,204.9L107.9,309.7v220.5L297.6,637l189-107l0.8-220.3L297.6,204.9z M267.2,564.9l-110.6-63.1V372.7l111.1,64.4
	L267.2,564.9z M187.8,321.1l109.9-60.6l110,60.8l-110,64L187.8,321.1z M438.1,501.7l-110.5,62.8V437.3l110.5-64.6V501.7z"
          />
        </svg>
      </div>

      <a
        href="#case"
        data-section="case"
        class="text-[14px] font-medium text-text hover:text-primary transition"
      >
        Кейс
      </a>
    </div>

    <a
      href="#hero"
      data-section="hero"
      class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-30 cursor-pointer transition-all duration-300 transform origin-center hover:scale-110"
      aria-label="Hero"
    >
      <svg
        viewBox="0 0 1008.66 1296"
        xmlns="http://www.w3.org/2000/svg"
        class="w-18 h-18 fill-logo drop-shadow-[0_0_12px_rgba(99,102,241,0.25)]"
      >
        <path
          d="M585.46,611.53c-9.95-4.97-8.67-28.76-9.11-40.11-.03-11.09,0-22.31-.01-33.43.99-35.23-4.16-72.29,9.85-104.91,4.65-10.8,11.26-20.77,19.22-30.16,117.11-120.05,237.6-236.99,355.86-355.95,6.57-6.53,14.51-14.61,19.31-21.13C1002.18-1.88,961.77.43,942.73.06c-19.39,0-38.8,0-58.2,0-21.21.09-41.92-.72-61.63,4.37-25.37,5.99-46.05,23-64.07,41.39-72.16,71.69-143.9,143.88-216.28,215.34-4.75,4.42-9.51,8.41-14.26,11.61-16.3,11.32-32.33,11.03-48.48-.39-4.66-3.19-9.32-7.14-13.98-11.49-74.67-73.65-148.49-148.23-223.08-221.97-11.84-11.42-25.06-22-39.86-28.56C178.23-.93,151.64,0,124.29.03c-20.95.01-42.03-.01-62.94.03-11.86.33-29.63.03-36.63,6.05-6.37,5.88-1.34,13.84,6.17,23.31,122.31,126.08,250.14,247.34,372.38,373.51,22.07,24.79,29.46,54.53,29.04,87.23-.5,168.43,1.19,337.14-.64,505.51-.8,9.5-2.6,16.57-5.93,19.94-8.82,8.52-24.18-7.67-32.57-15.12-71.63-71.44-143.81-142.48-214.85-214.51-5.46-5.99-10.49-12.17-14.8-18.65-15.21-21.95-19.35-48.65-19.17-74.98-1.08-103.08,2.03-206.48-1.29-309.49-1.46-13.35-4.61-25.76-10.3-37.59-10.65-22.36-28.81-38.72-46.47-56.47-10.12-10.09-20.24-20.18-30.37-30.27-12.4-11.94-22.08-23.51-35.55-31.46-16.27-8.41-18.37,7.82-19.62,23.31-.27,174.33-1.89,349.15.62,523.49,1.28,13.25,4.23,25.78,9.48,37.34,5.05,11.24,12.27,21.55,20.85,31.29,141.92,143.7,286.11,285.3,428.84,428.23,21,21.04,42.82,36.23,70.31,15.13,150.83-145.21,297.78-295.19,445.97-443.21,17.72-19.57,28.22-42.2,30.43-68.58,2.72-173.29.59-346.96.83-520.28-.41-9.91-1.52-18.1-3.95-23.1-7.45-15.37-25.33,2.92-34.01,10.66-122.25,120.18-242.02,243.49-365.23,362.6-8.12,6.16-13.47,9.59-19.38,7.6l-.07-.03ZM859.4,745.3c-3.98,10.12-11.17,18.71-18.74,26.5-80.27,82.84-160.6,165.74-240.89,248.56-3.33,3.42-7.35,7.33-10.84,9.72-7.14,4.93-10.63,1.96-11.82-6.71-1.92-51.24-.13-103.03-.7-154.37-.04-12.57,1.17-25.65,6.91-36.85,2.85-5.75,6.69-11.05,11.12-16.1,83.88-87.05,168.01-174.08,252.52-260.49,17.59-16.51,17.18,3.6,17.37,17.17-.59,51.8,1.24,103.83-.77,155.58-.69,5.91-1.99,11.53-4.1,16.81l-.07.18Z"
        />
      </svg>
    </a>

    <!-- RIGHT -->
    <div class="ml-auto flex items-center gap-5 z-10">
      <a
        href="#lab"
        data-section="lab"
        class="text-[14px] font-medium text-text hover:text-primary transition"
      >
        Лаборатория
      </a>

      <div
        class="w-4 h-4 flex items-center fill-primary justify-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 595.3 841.9"
          class="w-full h-auto text-primary"
        >
          <path
            d="M297.6,204.9L107.9,309.7v220.5L297.6,637l189-107l0.8-220.3L297.6,204.9z M267.2,564.9l-110.6-63.1V372.7l111.1,64.4
	L267.2,564.9z M187.8,321.1l109.9-60.6l110,60.8l-110,64L187.8,321.1z M438.1,501.7l-110.5,62.8V437.3l110.5-64.6V501.7z"
          />
        </svg>
      </div>

      <a
        href="#demo"
        data-section="demo"
        class="text-[14px] font-medium text-text hover:text-primary transition"
      >
        Демо
      </a>

      <!-- THEME SWITCH -->
      <div class="flex items-center gap-2">
        <!-- SUN -->
        <div id="sun-icon" class="text-secondary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0-1.414 1.414M7.05 16.95l-1.414 1.414M12 16a4 4 0 100-8 4 4 0 000 8"
            />
          </svg>
        </div>

        <!-- SWITCH -->
        <button
          id="theme-toggle"
          class="relative w-12 h-6 rounded-sm bg-bg/5 border border-primary/20 backdrop-blur-xl flex items-center px-1 transition-all duration-300 hover:border-primary/40 cursor-pointer shadow-[inset_0_2px_4px_rgba(0,0,0,0.35),inset_0_-1px_2px_rgba(255,255,255,0.03)]"
        >
          <div
            id="theme-thumb"
            class="absolute left-0.5 top-0.8 w-5 h-5 rounded-xs bg-primary shadow-[0_0_10px_color-mix(in_srgb,var(--primary)_35%,transparent),0_2px_6px_rgba(0,0,0,0.35)] transition-all duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
          ></div>
        </button>

        <!-- MOON -->
        <div id="moon-icon" class="text-secondary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M20.354 15.354A9 9 0 018.646 3.646
        9.003 9.003 0 0012 21
        9.003 9.003 0 0020.354 15.354z"
            />
          </svg>
        </div>
      </div>

      <!-- CTA -->
      <button
        class="h-9 px-4 rounded-md bg-primary/70 dark:text-text/80 text-sm font-semibold transition-all duration-300 hover:shadow-[0_0_12px_var(--primary)] hover:bg-primary/80 active:scale-[0.98] cursor-pointer"
      >
        Запустить прорыв
      </button>
    </div>
  </div>
</header>

<script src="{% static 'desktop/js/navbar.js' %}?v={{ APP_VERSION }}"></script>
<script src="{% static 'desktop/js/spa-nav.js' %}?v={{ APP_VERSION }}" defer></script>
